[package]
name = "sdw-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "sd-widgets PC daemon: virtual gamepads, extra monitor, notifications and Home Assistant"

[[bin]]
name = "sdw-daemon"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:qrcode"]

[dependencies]
sdw-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
getrandom.workspace = true
ureq.workspace = true
dirs.workspace = true
clap.workspace = true
tiny_http.workspace = true
viiper-client = { path = "../../vendor/viiper-client" }
eframe = { workspace = true, optional = true }
image.workspace = true
qrcode = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Devices_Radios",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-future = "0.3"
