[workspace]
resolver = "2"
members = [
    "crates/sdw-core",
    "crates/sdw-daemon",
    "crates/sdw-deck",
    "vendor/viiper-client",
]
default-members = ["crates/sdw-daemon", "crates/sdw-deck"]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["entitybtw"]
repository = "https://git.entitybtw.ru/entitybtw/sd-widgets"
homepage = "https://git.entitybtw.ru/entitybtw/sd-widgets"
description = "sd-widgets — a Steam Deck control surface and a PC companion daemon"

[workspace.dependencies]
sdw-core = { path = "crates/sdw-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
sha2 = "0.11"
getrandom = "0.4"
ureq = { version = "3.5", features = ["json"] }
dirs = "7.0"
clap = { version = "4.6", features = ["derive"] }
tiny_http = "0.12"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
qrcode = { version = "0.14", default-features = false }
libc = "0.2"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1
